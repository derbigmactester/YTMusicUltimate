name: Build and Release YTMusicUltimate (Final Fixed)
on:
  workflow_dispatch:
    inputs: 
      ipa_url:
        description: "Şifresi çözülmüş (Decrypted) IPA dosyasının direkt indirme linki"
        default: ""
        required: true
        type: string

      display_name:
        description: "Uygulama Adı (Opsiyonel)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Giriş sorunu yaşamamak için orijinal id önerilir)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Validate IPA URL
        run: |
          curl -L -r 0-1023 -o sample.part "${{ inputs.ipa_url }}" > /dev/null 2>&1
          file_type=$(file --mime-type -b sample.part)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Hata: Geçersiz IPA dosyası. Tespit edilen tip: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan (Pyzule)
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download YouTube Music IPA
        run: wget "${{ inputs.ipa_url }}" --no-verbose -O ytm.ipa

      - name: Build Tweak for Sideloading (Rootless Mode)
        run: |
          cd main
          # Sideloading için rootless (arm64) şemasıyla derliyoruz
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1 THEOS_PACKAGE_SCHEME=rootless
          # Sadece arm64 olan deb dosyasını dışarı çıkarıyoruz
          mv packages/*iphoneos-arm64.deb ../ytmult.deb

      - name: Inject tweak into provided IPA
        # -u: unrestrict, -w: weak-load, -l: substrate kütüphanesi, -e: entitlements yaması
        run: cyan -i ytm.ipa -o YTMusicUltimate.ipa -uw -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}" -f ytmult.deb -l "CydiaSubstrate" -e

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: YTMusicUltimate (${{ github.run_number }})
          files: YTMusicUltimate.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::İşlem başarılı! IPA Dosyası burada: https://github.com/${{ github.repository }}/releases"
